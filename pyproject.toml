[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-data-extraction"
version = "0.1.0"
description = "Pipeline for extracting structured data (tables, sections, key/value fields) from PDF documents using docling, embeddings, and LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimitrios Avellas", email = "dimitrisavellas8@gmail.com" }]

# Mirrors requirements.txt.
dependencies = [
    "docling==2.82.0",
    "docling-core==2.70.2",
    "docling-parse==5.6.1",
    "docling-ibm-models==3.13.0",
    "yake",
    "sentence-transformers",
    "numpy",
    "pandas",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "instructor",
    "openai",
    "jinja2",
    "scikit-learn==1.8.0",  
    "joblib",
    "pymupdf",
    "html5lib",
    "einops",
    "rapidfuzz",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
structured-extract = "structured_data_extraction.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
