[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-data-extraction"
version = "0.2.1"
description = "Pipeline for extracting structured data (tables, sections, key/value fields) from PDF documents using docling, embeddings, and LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dimitrios Avellas", email = "dimitrisavellas8@gmail.com" }]

# Mirrors requirements.txt.
dependencies = [
    "docling==2.82.0",
    "docling-core==2.70.2",
    "docling-parse==5.6.1",
    "docling-ibm-models==3.13.0",
    "yake",
    "sentence-transformers",
    "numpy",
    "pandas",
    "pydantic",
    "instructor",
    "openai",
    "jinja2",
    "scikit-learn==1.8.0",  
    "joblib",
    "pymupdf",

    "einops",
    "rapidfuzz",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
structured-extract = "structured_data_extraction.main:main"
structured-extract-convert = "structured_data_extraction.convert:main"
structured-extract-vocab = "structured_data_extraction.vocab:main"
structured-extract-classify = "structured_data_extraction.classify:main"
structured-extract-embed = "structured_data_extraction.embed:main"
structured-extract-search = "structured_data_extraction.search:main"
structured-extract-extract = "structured_data_extraction.extract:main"
structured-extract-rate = "structured_data_extraction.rater:main"
structured-extract-records = "structured_data_extraction.records:main"
structured-extract-filter = "structured_data_extraction.filter_records:main"

[project.urls]
Repository = "https://github.com/dimitrisavellas/structured-extraction.git"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
structured_data_extraction = ["templates/*.j2", "models/section_classifier/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
lint = ["ruff==0.17.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RET", "PERF", "UP", "FURB", "PL", "C90", "N", "PIE", "RUF", "D", "ANN", "PLR1702"]
ignore = [
    "PLR2004",  # magic numbers: too noisy for data work
    "PLR0911",  # return count: guard clauses (early returns) are the preferred style
    "D100", "D104", "D105", "D107",  # no required module, package, magic-method, __init__ docstrings
    "ANN401",   # allow Any where a library gives untyped objects
]
allowed-confusables = ["‐", "‑", "‒", "–", "−"]  # dash variants in text-normalization code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 40
max-args = 6
max-nested-blocks = 3
